services:
  web:
    image: ${WEB_IMAGE:-knowledge-web:latest}
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-knowledge-api:latest}
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-knowledge_dev}@postgres:5432/${POSTGRES_DB:-knowledge}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-knowledge_dev_only_change_me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KNOELEDGE_API_KEY: ${KNOELEDGE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/search-health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
