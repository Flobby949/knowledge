name: Test, build, and deploy
run-name: Deploy ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: knowledge-production-pipeline
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a new, increasing version on main
        id: release
        env:
          TAG_CREATED: ${{ github.event.created }}
        shell: bash
        run: |
          release_tag="$GITHUB_REF_NAME"
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$TAG_CREATED" != "true" ]]; then
            echo "Release tags must be newly created; updates to existing tags cannot deploy." >&2
            exit 1
          fi

          if [[ ! "$release_tag" =~ $version_pattern ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, for example v1.4.0." >&2
            exit 1
          fi

          mapfile -t release_tags < <(
            git tag --list |
              grep -E "$version_pattern" |
              sort -V
          )
          highest_index=$((${#release_tags[@]} - 1))
          highest_tag="${release_tags[$highest_index]}"

          if [[ "$release_tag" != "$highest_tag" ]]; then
            echo "Release $release_tag must be higher than the existing maximum $highest_tag." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $release_tag must point to a commit on main." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: knowledge_ci
      DATABASE_URL: postgresql://knowledge:knowledge_dev@127.0.0.1:5432/knowledge
      TEST_DATABASE_URL: postgresql://knowledge:knowledge_dev@127.0.0.1:5432/knowledge
      MODEL_CONFIG_ENCRYPTION_KEY: knowledge_ci_only_encryption_key
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Start PostgreSQL
        run: |
          docker compose up -d postgres
          for attempt in {1..30}; do
            if docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply migrations
        run: pnpm run db:migrate

      - name: Run tests
        run: pnpm exec vitest run --no-file-parallelism

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  build:
    name: Build amd64 images
    needs:
      - validate_release
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.images.outputs.api }}
      web_image: ${{ steps.images.outputs.web }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/knowledge-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/knowledge-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.api }}:sha-${{ github.sha }}
            ${{ steps.images.outputs.api }}:${{ needs.validate_release.outputs.release_tag }}
            ${{ steps.images.outputs.api }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.web }}:sha-${{ github.sha }}
            ${{ steps.images.outputs.web }}:${{ needs.validate_release.outputs.release_tag }}
            ${{ steps.images.outputs.web }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      API_IMAGE: ${{ needs.build.outputs.api_image }}:sha-${{ github.sha }}
      WEB_IMAGE: ${{ needs.build.outputs.web_image }}:sha-${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Prepare SSH
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH DEPLOY_PORT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment value: ${name}" >&2
              exit 1
            fi
          done

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT must be numeric" >&2
            exit 1
          fi

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path without spaces" >&2
            exit 1
          fi

          install -d -m 700 "$RUNNER_TEMP/knowledge-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/knowledge-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/knowledge-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/knowledge-ssh/id_ed25519" "$RUNNER_TEMP/knowledge-ssh/known_hosts"

      - name: Verify deployment directory
        shell: bash
        run: |
          ssh \
            -i "$RUNNER_TEMP/knowledge-ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/knowledge-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env' && mkdir -p '$DEPLOY_PATH/deploy'"

      - name: Upload deployment files
        shell: bash
        run: |
          scp \
            -i "$RUNNER_TEMP/knowledge-ssh/id_ed25519" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/knowledge-ssh/known_hosts" \
            compose.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/compose.yaml"

          scp \
            -i "$RUNNER_TEMP/knowledge-ssh/id_ed25519" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/knowledge-ssh/known_hosts" \
            deploy/production.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/deploy/production.sh"

      - name: Deploy release
        shell: bash
        run: |
          ssh \
            -i "$RUNNER_TEMP/knowledge-ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/knowledge-ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '$DEPLOY_PATH/deploy/production.sh' && '$DEPLOY_PATH/deploy/production.sh' '$API_IMAGE' '$WEB_IMAGE'"
